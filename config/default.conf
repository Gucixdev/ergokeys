# ergokeys weights: name value, one per line; every line shown is the default.
# Cost is in millimetres of weighted finger travel plus penalties.

# cost per millimetre of weighted finger travel
travel 1

# multiplier on the vertical part of a finger move; reaching up or down is slower than sideways
vertical_factor 1.3

# a pinky that has to move to press a modifier
pen_mod_pinky 15

# a ring finger that has to move to press a modifier
pen_mod_ring 5

# per modifier held by a non-thumb finger of the hand that also presses the key
pen_one_hand 20

# a sequence step whose key uses the finger of the previous step's different key
pen_same_finger 25

# a sequence step that presses the previous step's key again
pen_repeat_key 5

# per key row above the finger's home row beyond the first (the number row is one extra row)
pen_far_row 12

# two keys of one step that need the same finger
pen_finger_conflict 200

# subtracted when modifiers and key are on different hands, or consecutive keys alternate hands
bonus_alternate 6

# 1 counts the walk back to home after the last step, 0 stops at the last key
return_trip 0

# 0 keeps each action's modifiers and moves only its key, 1 may also use any modifier set seen in the input
suggest_mods 0

# seed of the suggestion search; the same seed gives the same result
seed 1

# simulated annealing steps in suggest, 0 for greedy swaps only
anneal_iters 200000

# annealing start temperature, in cost units per average action weight
anneal_t0 8

# annealing end temperature
anneal_t1 0.05

# most passes of the greedy improvement before and after annealing
greedy_passes 30
